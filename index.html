<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nathan's Universe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="scene-container"></div>

    <!-- 顶部标题与工具栏 -->
    <header class="topbar">
      <div class="title">
        <h1 id="app-title">Nathan 的宇宙</h1>
        <span class="subtitle" id="app-subtitle">动态交互 3D 探索</span>
      </div>
      <div class="controls">
        <div class="control-group">
          <label class="ctrl-label" id="speed-label" for="speed-slider">速度</label>
          <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" />
          <span class="speed-value" id="speed-value">1.0×</span>
        </div>
        <button class="ctrl-btn" id="pause-btn" title="暂停 / 播放">⏸</button>
        <button class="ctrl-btn active" id="orbits-btn" title="显示 / 隐藏轨道">轨道</button>
        <button class="ctrl-btn active" id="labels-btn" title="显示 / 隐藏标签">标签</button>
        <button class="ctrl-btn" id="pixel-btn" title="像素模式（星球变方块）">像素</button>
        <button class="ctrl-btn" id="reset-btn" title="重置视角">重置</button>
        <button class="ctrl-btn quiz-btn" id="quiz-btn" title="太阳系小测验">测验</button>
        <button class="ctrl-btn lang-btn" id="lang-btn" title="Switch language / 切换语言">EN</button>
      </div>
    </header>

    <!-- 底部导航条（上行：行星/星带，下行：飞行器） -->
    <div class="bottom-nav">
      <nav class="chip-bar" id="chip-bar"></nav>
      <nav class="chip-bar spacecraft-bar" id="spacecraft-bar"></nav>
    </div>

    <!-- 信息面板 -->
    <aside class="info-panel" id="info-panel" aria-hidden="true">
      <button class="panel-close" id="panel-close" title="关闭" aria-label="关闭">×</button>
      <div class="panel-content" id="panel-content"></div>
    </aside>

    <!-- 悬浮提示 -->
    <div class="hint" id="hint">🖱 拖动旋转 · 滚轮缩放 · 点击星球查看详情</div>
    <div class="tooltip" id="tooltip"></div>

    <!-- 加载遮罩 -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loading-text">正在构建太阳系…</div>
    </div>
  </div>

  <!-- 小测验弹窗 -->
  <div class="quiz-modal" id="quiz-modal" aria-hidden="true">
    <div class="quiz-backdrop" id="quiz-backdrop"></div>
    <div class="quiz-dialog" role="dialog" aria-modal="true">
      <button class="quiz-close" id="quiz-close" title="关闭">×</button>
      <h2 class="quiz-title" id="quiz-title">🪐 太阳系小测验</h2>
      <p class="quiz-sub" id="quiz-sub">从题库随机抽取 5 题 · 选项顺序随机 · 答对有鼓励评价</p>
      <div class="quiz-body" id="quiz-body"></div>
      <div class="quiz-footer">
        <span class="quiz-score" id="quiz-score"></span>
        <button class="quiz-submit" id="quiz-submit">提交答案</button>
      </div>
    </div>
  </div>

  <script>
    // 兜底：即使模块脚本加载失败，也把错误显示在加载遮罩上
    (function () {
      function showErr(msg) {
        var el = document.getElementById('loading');
        if (!el) return;
        var t = el.querySelector('.loading-text');
        var s = el.querySelector('.loading-spinner');
        if (s) s.style.display = 'none';
        if (t) { t.textContent = '加载出错：' + msg; t.style.color = '#ff8a8a'; }
        el.classList.remove('hidden');
      }
      window.addEventListener('error', function (e) {
        if (e && e.message) showErr(e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showErr(r && r.message ? r.message : String(r || 'Promise 错误'));
      });
      setTimeout(function () {
        var el = document.getElementById('loading');
        if (el && getComputedStyle(el).visibility !== 'hidden') {
          var t = el.querySelector('.loading-text');
          if (t && t.textContent.indexOf('失败') < 0 && t.textContent.indexOf('出错') < 0) {
            t.textContent = '加载超时：请确认是通过本地服务器访问，并查看浏览器控制台。';
            t.style.color = '#ffb06a';
          }
        }
      }, 4000);
    })();
  </script>
  <script src="js/bundle.js" defer></script>
</body>
</html>
